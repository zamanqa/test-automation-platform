; Mounted into core_api_app by docker-compose.speed.yml.
; The code is a Windows folder mounted into Docker, where every file check (stat) is slow.
; With timestamp checks on, OPcache re-checks every file once it is a few seconds old, and a request
; after a pause spent ~9s just checking ~1,300 files. So OPcache never checks timestamps here:
; the launcher reloads PHP after "Pull latest", and "Reload backend code" picks up edits.
opcache.validate_timestamps=0
opcache.max_accelerated_files=60000
opcache.memory_consumption=768
opcache.interned_strings_buffer=64
realpath_cache_size=16M
realpath_cache_ttl=86400

; PHP warnings/deprecations printed into a response turn JSON into HTML, so the apps can't read it
; (Hub's company switch failed with "Expected JSON … but received an HTML document").
; They still go to the container log: docker logs core_api_app
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
